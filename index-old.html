<style>
:root{--bk:#10100F;--c1:#191918;--c2:#242321;--bd:#34322F;--pp:#F1EEE7;--cr:#E7E1D6;--gy:#969187;--am:#C69B65;--ol:#92947A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bk);color:var(--pp);font:14px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--gy);letter-spacing:.04em}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:52px minmax(0,1fr) auto}
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--bd);background:var(--bk)}
.logo{letter-spacing:.34em;font-weight:500;font-size:13px;margin-right:6px}
#fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:transparent;border:1px solid var(--bd);color:var(--pp);padding:6px 12px;border-radius:6px;min-height:36px;cursor:pointer;font:inherit}
.btn:hover:not(:disabled){background:var(--c2)}.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.pc:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.btn.pri{background:var(--am);color:#1a1612;border-color:var(--am);font-weight:500}
.btn[aria-pressed=true]{border-color:var(--am);color:var(--am)}
#stage{position:relative;display:flex;align-items:center;justify-content:center;background:var(--c1);min-height:0;overflow:hidden}
#frame{position:relative;touch-action:none;box-shadow:0 8px 40px #000a}
#frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#og{clip-path:inset(0 50% 0 0)}
#dv{position:absolute;top:0;bottom:0;width:2px;background:var(--pp);margin-left:-1px;cursor:ew-resize}
#dv::after{content:"◂ ▸";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--pp);color:var(--bk);border-radius:20px;padding:5px 9px;font-size:10px;white-space:nowrap}
#tools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
#tools .btn{background:#10100Fcc;font-size:12px}
#msg{position:absolute;right:12px;bottom:12px;max-width:60%;text-align:right}
#msg.err{color:#e0907a}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;background:radial-gradient(circle at 50% 40%,var(--c2),var(--bk) 75%)}
#empty h1{font-size:34px;font-weight:500;font-style:italic;max-width:14em;line-height:1.1}
#stage.drag{outline:2px dashed var(--am);outline-offset:-10px}
#strip-wrap{grid-column:1;border-top:1px solid var(--bd);background:var(--bk);padding:8px 0 10px;min-width:0}
#tabs{display:flex;gap:2px;padding:0 12px 8px;overflow-x:auto}
.tab{background:none;border:0;color:var(--gy);padding:6px 10px;cursor:pointer;font:inherit;white-space:nowrap;border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--pp);border-color:var(--am)}
#strip{display:flex;gap:10px;overflow-x:auto;padding:0 12px 4px;scroll-snap-type:x proximity}
.pc{flex:0 0 112px;background:var(--c1);border:1px solid var(--bd);border-radius:4px;padding:6px 6px 8px;color:var(--pp);text-align:left;cursor:pointer;font:inherit;scroll-snap-align:start;position:relative}
.pc canvas{width:100%;aspect-ratio:3/2;background:var(--c2);display:block;border-radius:2px}
.pc[aria-pressed=true]{border-color:var(--am);background:var(--c2)}
.pc[aria-pressed=true]::after{content:"● ACTIVE";position:absolute;top:10px;left:10px;font:9px "IBM Plex Mono",monospace;color:var(--am);background:#10100Fd0;padding:1px 4px;border-radius:2px}
.pc .fn{display:flex;justify-content:space-between;margin-top:6px}
#panel{grid-column:2;grid-row:2/4;border-left:1px solid var(--bd);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:var(--bk)}
#panel h2{font-size:26px;font-weight:500;line-height:1}
.paper{background:var(--pp);color:#24221F;border-radius:3px;padding:10px 12px}
.paper .mono{color:#6b665d}
.row{display:flex;justify-content:space-between;align-items:baseline}
input[type=range]{width:100%;height:28px;accent-color:var(--am);background:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--gy);padding:8px 4px;cursor:pointer;font:inherit;min-height:36px}
.seg button[aria-pressed=true]{background:var(--c2);color:var(--am)}
label.chk{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
input[type=checkbox]{accent-color:var(--am);width:18px;height:18px}
select{background:var(--c2);color:var(--pp);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit}
hr{border:0;border-top:1px solid var(--bd);width:100%}
@media(max-width:820px){
 #app{display:block;height:auto;min-height:100%}
 #stage{height:56vh}
 #panel{border-left:0;border-top:1px solid var(--bd)}
 #msg{max-width:90%;bottom:52px}
 .hide-m{display:none}
}
@media(prefers-reduced-motion:no-preference){.pc{transition:border-color .2s,background .2s}}

/* ---------- APP ---------- */
const S={id:'portra',k:100,ga:18,cs:1,du:false,ha:false},cache={},hist=[],redoS=[];let bmp,src,pw,ph,outImg,seed=1,cmp=false,hold=false,pos=.5,fileName='';
const cur=()=>PRESETS.find(p=>p.id==S.id),cv=$('#cv'),og=$('#og'),cx=cv.getContext('2d'),ox=og.getContext('2d'),preps={};
const getE=P=>preps[P.id]||(preps[P.id]=prep(P));

function render(){if(!src)return;const P=cur();
 if(cache.a!==P.id){cache.g=new Uint8ClampedArray(src.data.length);gradeRows(src.data,cache.g,getE(P),P,pw,0,ph);cache.a=P.id;cache.b=null}
 const kb=[S.ga,S.cs,S.du,S.ha,P.id].join();
 if(cache.b!==kb){cache.f=stageB(cache.g,pw,ph,P,opts(P),seed);cache.b=kb}
 mix(src.data,cache.f,S.k/100,outImg.data);cx.putImageData(outImg,0,0);msg('')}
const opts=P=>({ga:S.ga,cs:S.cs,cr:S.cs<1?.7:S.cs>1?1.25:1,du:S.du,ha:S.ha});
let pend=0;const sched=()=>{if(pend)return;pend=1;requestAnimationFrame(()=>{pend=0;render()})};
function sync(){const P=cur();$('#pname').textContent=P.name;$('#pcat').textContent=P.cat.toUpperCase()+' · '+String(PRESETS.indexOf(P)+1).padStart(2,'0')+' · GRAIN '+S.ga;$('#pdesc').textContent=P.desc;
 $('#k').value=S.k;$('#kv').textContent=S.k+'%';$('#ga').value=S.ga;$('#gav').textContent=S.ga;$('#du').checked=S.du;$('#ha').checked=S.ha;$('#note').textContent=P.note||'';
 document.querySelectorAll('#gc button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v==S.cs));
 document.querySelectorAll('.pc').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id==S.id));
 $('#undo').disabled=hist.length<2;$('#redo').disabled=!redoS.length}
const snap=()=>JSON.stringify(S);
function commit(){const s=snap();if(hist[hist.length-1]!==s){hist.push(s);redoS.length=0}sync()}
function restore(s){Object.assign(S,JSON.parse(s));sync();sched()}
$('#undo').onclick=()=>{if(hist.length>1){redoS.push(hist.pop());restore(hist[hist.length-1])}};
$('#redo').onclick=()=>{if(redoS.length){const s=redoS.pop();hist.push(s);restore(s)}};
function setPreset(id){S.id=id;const P=cur();S.ga=P.g[0];S.du=!!P.fx.dust;S.ha=!!P.fx.halation;commit();sched()}
/* strip */
let cat='All';const tabs=$('#tabs'),strip=$('#strip');
CATS.forEach(c=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.textContent=c;b.onclick=()=>{cat=c;buildStrip()};tabs.append(b)});
function buildStrip(){tabs.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.textContent==cat));strip.innerHTML='';
 PRESETS.forEach((P,i)=>{if(cat!='All'&&P.cat!=cat)return;const b=document.createElement('button');b.className='pc';b.dataset.id=P.id;b.setAttribute('aria-label',P.name+', '+P.cat);
  b.innerHTML='<canvas width="112" height="75"></canvas><div class="fn"><span>'+P.name+'</span><span class="mono">'+String(i+1).padStart(2,'0')+'</span></div>';b.onclick=()=>setPreset(P.id);strip.append(b)});
 drawThumbs();sync()}
let thumb;function drawThumbs(){if(!thumb)return;document.querySelectorAll('.pc').forEach(b=>{const P=PRESETS.find(p=>p.id==b.dataset.id),o=new Uint8ClampedArray(thumb.data.length);

/* load */
const pick=()=>$('#file').click();$('#load').onclick=$('#load2').onclick=pick;
$('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
const st=$('#stage');st.ondragover=e=>{e.preventDefault();st.classList.add('drag')};st.ondragleave=()=>st.classList.remove('drag');
st.ondrop=e=>{e.preventDefault();st.classList.remove('drag');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
async function load(f){try{if(!/^image\//.test(f.type))throw Error('Unsupported file. Please choose a JPEG, PNG or WebP image.');
 msg('Preparing negative…');let b;try{b=await createImageBitmap(f)}catch(e){throw Error('This image could not be decoded by your browser.')}

 bmp=b;src=x.getImageData(0,0,pw,ph);outImg=new ImageData(pw,ph);cv.width=og.width=pw;cv.height=og.height=ph;ox.putImageData(src,0,0);

/* compare */

 try{msg('Preparing export…');await new Promise(r=>setTimeout(r));const w=bmp.width,h=bmp.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0);
